name: Verificar galería publicada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-gallery-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  galeria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar la galería REAL de GitHub Pages
        run: |
          mkdir -p artifacts/galeria
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            for (const [name,width,height] of [['desktop',1440,900],['movil',390,844]]) {
              const page=await b.newPage({viewport:{width,height}});
              const uri='https://michaelaguilausa.github.io/aguila-store/?verificacion='+Date.now()+'#colores';
              const response=await page.goto(uri,{waitUntil:'networkidle',timeout:30000});
              assert.equal(response.status(),200);
              console.log(name+' VERSION PUBLICA: '+response.status());
              const links=page.locator('.gallery-grid button.gallery-photo-link');
              assert.equal(await links.count(),4);
              for(let i=0;i<4;i++){
                const button=links.nth(i);
                assert.equal(await button.getAttribute('type'),'button');
                await button.click();
                const dialog=page.locator('#galleryViewer');
                await dialog.waitFor({state:'visible'});
                assert.ok(await dialog.evaluate(el=>el.open),'dialog nativo abierto');
                assert.ok(await dialog.evaluate(el=>el.matches(':modal')),'en top layer modal');
                const close=dialog.locator('.gallery-viewer-close');
                assert.ok(await close.isVisible());
                await page.waitForTimeout(1000);
                assert.ok(await dialog.evaluate(el=>el.open),'foto estable tras un segundo');
                await close.click();
                assert.equal(await dialog.isVisible(),false);
                assert.ok(!page.url().includes('.webp'));
                console.log(name+' FOTO '+(i+1)+' MODAL NATIVO ABRE Y CIERRA - OK');
              }
              // Carrito real: aumentar, disminuir, eliminar y persistencia tras recarga.
              await page.locator('.product-featured-card .add-button').first().click();
              const cart=page.locator('#cartDrawer');
              assert.ok(await cart.evaluate(e=>e.classList.contains('open')));
              assert.equal(await page.locator('#cartCount').innerText(),'1');
              assert.equal(await page.locator('#subtotal').innerText(),'$12.99');
              assert.equal(await page.locator('#shipping').innerText(),'A confirmar');
              assert.equal(await page.locator('#total').innerText(),'Pendiente');
              assert.equal(await page.locator('#checkoutButton').isDisabled(),true);
              await page.locator('.quantity button').last().click();
              assert.equal(await page.locator('#subtotal').innerText(),'$25.98');
              await page.locator('.quantity button').first().click();
              assert.equal(await page.locator('#subtotal').innerText(),'$12.99');
              await page.locator('#closeCart').click();
              await page.reload({waitUntil:'networkidle'});
              assert.equal(await page.locator('#cartCount').innerText(),'1','persiste carrito');
              await page.locator('#openCart').click();
              await page.locator('.remove-cart-line').click();
              assert.equal(await page.locator('#cartCount').innerText(),'0');
              await page.locator('#closeCart').click();
              await page.locator('.product-featured-card .add-button').last().click();
              await page.locator('#clearCart').click();
              assert.equal(await page.locator('#cartCount').innerText(),'0');
              assert.equal(await page.locator('#checkoutButton').isDisabled(),true);
              await page.keyboard.press('Escape');
              assert.ok(!(await cart.evaluate(e=>e.classList.contains('open'))));
              console.log(name+' CARRITO: AÑADIR, CAMBIAR CANTIDAD, ELIMINAR, VACIAR, PERSISTENCIA Y SIN PAGOS - OK');
              await page.screenshot({path:'artifacts/galeria/'+name+'-galeria.png',fullPage:false});
              await page.close();
            }
            await b.close();
            console.log('RESULTADO: GALERIA PUBLICA OPERATIVA EN ESCRITORIO Y MOVIL');
          })().catch(e=>{console.error('FALLO EN LA GALERIA REAL: ',e);process.exit(1)});
          NODE
      - name: Capturas de galería en computadora y teléfono
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aguila-store-galeria-comprobada
          path: artifacts/galeria/*.png
          if-no-files-found: warn
