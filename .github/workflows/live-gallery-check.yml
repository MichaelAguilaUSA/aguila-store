name: Verificar galería publicada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-gallery-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  galeria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar la galería REAL de GitHub Pages
        run: |
          mkdir -p artifacts/galeria
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            for (const [name,width,height] of [['desktop',1440,900],['movil',390,844]]) {
              const page=await b.newPage({viewport:{width,height}});
              const uri='https://michaelaguilausa.github.io/aguila-store/?verificacion='+Date.now()+'#colores';
              const response=await page.goto(uri,{waitUntil:'networkidle',timeout:30000});
              assert.equal(response.status(),200);
              console.log(name+' VERSION PUBLICA: '+response.status());
              const links=page.locator('.gallery-grid a.gallery-photo-link');
              assert.equal(await links.count(),4,'Deben existir cuatro enlaces en la galeria');
              for (let i=0;i<4;i++){
                const link=links.nth(i);
                const href=await link.getAttribute('href');
                assert.ok(href.startsWith('#vista-'),'Enlace debe apuntar a ventana interna. Enlace encontrado: '+href);
                await link.click();
                const id=href.substring(1);
                const view=page.locator('#'+id);
                await view.waitFor({state:'visible',timeout:3000});
                assert.equal(await view.evaluate(e=>getComputedStyle(e).display),'flex');
                const close=view.locator('.gallery-lightbox-close');
                assert.ok(await close.isVisible(),'X debe ser visible');
                const noFloatingFrame = async () => {
                  const result = await page.evaluate(() => {
                    const gallery = document.querySelector('.gallery-grid');
                    const card = document.querySelector('.gallery-grid .gallery-product-card');
                    const active = document.querySelector('.gallery-lightbox:target');
                    return {
                      galleryVisibility: getComputedStyle(gallery).visibility,
                      galleryCardTransform: getComputedStyle(card).transform,
                      lightboxVisible: active && getComputedStyle(active).display === 'flex',
                      scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior
                    };
                  });
                  assert.equal(result.galleryVisibility,'hidden',name+' marco de galería NO debe flotar');
                  assert.equal(result.galleryCardTransform,'none',name+' sin transform de miniatura');
                  assert.equal(result.scrollBehavior,'auto',name+' desplazamiento inmediato');
                  assert.ok(result.lightboxVisible,name+' foto ampliada visible');
                };
                await noFloatingFrame();
                await page.waitForTimeout(900);
                await noFloatingFrame();
                if(i===0) await page.screenshot({path:'artifacts/galeria/'+name+'-ampliada.png'});
                await close.click();
                assert.equal(await view.isVisible(),false,'Al pulsar X debe cerrar la imagen');
                assert.ok(!page.url().includes('.webp'),'No navegar fuera de la tienda');
                console.log(name+' FOTO '+(i+1)+' ABRE, X VISIBLE Y CIERRA - OK');
              }
              await page.screenshot({path:'artifacts/galeria/'+name+'-galeria.png',fullPage:false});
              await page.close();
            }
            await b.close();
            console.log('RESULTADO: GALERIA PUBLICA OPERATIVA EN ESCRITORIO Y MOVIL');
          })().catch(e=>{console.error('FALLO EN LA GALERIA REAL: ',e);process.exit(1)});
          NODE
      - name: Capturas de galería en computadora y teléfono
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aguila-store-galeria-comprobada
          path: artifacts/galeria/*.png
          if-no-files-found: warn
