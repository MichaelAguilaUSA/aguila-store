name: Cloudflare Workers - pruebas sin cobros
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar seguridad y compras simuladas sin cobros
        run: node cloudflare/test.mjs
      - name: Compilar Cloudflare Worker realmente sin publicar
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4 deploy --dry-run --outdir dist
          test -n "$(find dist -type f -name '*.js' -print -quit)"
          echo "WORKER COMPILADO CORRECTAMENTE; NO SE HA DESPLEGADO"
